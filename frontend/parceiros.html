<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojas Parceiras - PERSONALIZE Hub</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/theme.js"></script>
</head>
<body>
    <div class="layout"><aside id="sidebar" class="sidebar"></aside><main class="main">
        <header class="page-header"><div class="page-title"><h1> Lojas Parceiras</h1><p>Cadastro, aprovação e dados das lojas.</p></div></header>
        <section class="card">
            <div class="card-title"><span id="tituloFormParceiro">Nova loja parceira</span><button class="btn btn-light hidden" id="btnCancelarParceiro">Cancelar edição</button></div>
            <form id="formParceiro">
                <input type="hidden" id="parceiroId">
                <div class="form-grid">
                    <div class="form-group"><label>Nome da loja</label><input id="nome_loja" required></div>
                    <div class="form-group"><label>Responsável</label><input id="responsavel" required></div>
                    <div class="form-group"><label>Telefone/WhatsApp</label><input id="telefone"></div>
                    <div class="form-group"><label>CNPJ/CPF</label><input id="cnpj_cpf"></div>
                    <div class="form-group"><label>E-mail login</label><input id="email" type="email" placeholder="E-mail de login"></div>
                    <div class="form-group"><label>Usuário login</label><input id="usuario"></div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input id="senha" type="password" placeholder="Obrigatória no cadastro">
                        <small id="senhaHint" style="display:none; color:var(--muted); margin-top:4px; font-size:12px;">Deixe em branco para manter a senha atual.</small>
                    </div>
                    <div class="form-group"><label>Status</label><select id="status"><option value="ATIVO">ATIVO</option><option value="PENDENTE">PENDENTE</option><option value="INATIVO">INATIVO</option></select></div>
                    <div class="form-group"><label>CEP</label><input id="cep"></div>
                    <div class="form-group"><label>Rua</label><input id="rua"></div>
                    <div class="form-group"><label>Número</label><input id="numero"></div>
                    <div class="form-group"><label>Complemento</label><input id="complemento"></div>
                </div>
                <button class="btn btn-primary w-full mt-3" id="btnSalvarParceiro">Salvar loja</button>
            </form>
        </section>
        <section class="card"><div class="card-title">Lista de lojas</div><div class="table-container"><table><thead><tr><th>Status</th><th>Loja</th><th>Responsável</th><th>Telefone</th><th>Usuário</th><th>Ações</th></tr></thead><tbody id="tabelaParceiros"></tbody></table></div></section>
    </main></div>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/pages/parceiros.js"></script>
</body>
</html>
