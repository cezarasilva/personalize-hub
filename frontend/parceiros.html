<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lojas Parceiras - PERSONALIZE Hub</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        /* ==========================================
           🖥️ MODO DESKTOP (PC) 
           ========================================== */
        body { display: flex; background: #f3f4f6; height: 100vh; overflow: hidden; flex-direction: row; }
        
        .sidebar { width: 250px; background: #1f2937; color: #fff; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-top { padding: 25px 20px; text-align: center; background: #111827; }
        .sidebar-top h2 { color: #60a5fa; font-weight: 800; font-size: 1.5rem; margin: 0; }
        .btn-menu { display: none; } 
        
        .sidebar-links { display: flex; flex-direction: column; flex: 1; overflow-y: auto; }
        .sidebar a { padding: 15px 20px; color: #d1d5db; text-decoration: none; border-left: 4px solid transparent; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .sidebar a:hover { background: #374151; color: #fff; }
        .sidebar a.ativo { background: #374151; border-left-color: #3b82f6; color: #fff; }
        .btn-sair { margin-top: auto; color: #f87171 !important; border-top: 1px solid #374151; }

        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e5e7eb;}
        
        .header-lojas { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: #10b981; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add:hover { background: #059669; }
        
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 800px; }
        th, td { text-align: left; padding: 15px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f9fafb; color: #6b7280; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        
        .badge-status { padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 11px; text-transform: uppercase; display: inline-block; }
        .bg-ativo { background: #d1fae5; color: #065f46; }
        .bg-pendente { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .bg-inativo { background: #fee2e2; color: #991b1b; }

        .btn-acao { background: none; border: none; cursor: pointer; font-size: 18px; margin-right: 10px; transition: 0.2s; }
        .btn-acao:hover { transform: scale(1.2); }
        .empty-state { text-align: center; padding: 30px; color: #9ca3af; font-size: 14px; }

        /* ==========================================
           📱 MODO CELULAR 
           ========================================== */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: visible; }
            .sidebar { width: 100%; height: auto; position: relative; overflow: visible; }
            .sidebar-top { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #111827; }
            .sidebar-top h2 { font-size: 1.3rem; text-align: left; }
            .btn-menu { display: flex; background: #3b82f6; color: white; border: none; font-size: 24px; width: 40px; height: 40px; border-radius: 6px; align-items: center; justify-content: center; cursor: pointer; }
            .sidebar-links { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #1f2937; box-shadow: 0 10px 15px rgba(0,0,0,0.5); z-index: 9999; }
            .sidebar-links.ativo-mobile { display: flex !important; }
            .sidebar a { padding: 15px 20px; border-bottom: 1px solid #374151; border-left: none; }
            .sidebar a.ativo { border-left: none; background: #374151; border-left: 4px solid #3b82f6; }
            
            .main { padding: 15px; }
            .card { padding: 15px; }
            .header-lojas { flex-direction: column; align-items: stretch; gap: 15px; }
            .btn-add { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    
    <!-- BARRA LATERAL -->
    <div class="sidebar">
        <div class="sidebar-top">
            <h2>PERSONALIZE</h2>
            <button class="btn-menu" onclick="toggleMenu()">☰</button>
        </div>
        <div class="sidebar-links" id="menuLinks">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="produtos.html">📦 Produtos</a>
            <a href="parceiros.html" class="ativo">🏪 Lojas</a>
            <a href="usuarios.html">👥 Usuários</a>
            <a href="remessas.html">🚚 Remessas</a>
            <a href="vendas.html">💰 Caixa</a>
            <a class="btn-sair" onclick="logout()">🚪 Sair</a>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main">
        <div class="card">
            <div class="header-lojas">
                <h2>🏪 Gestão de Lojas & Parceiros</h2>
                <button class="btn-add" onclick="abrirModalNovaLoja()">➕ Cadastrar Nova Loja</button>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Nome da Loja</th>
                            <th>Responsável</th>
                            <th>Telefone / Whats</th>
                            <th>Usuário (Login)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaParceiros">
                        <tr><td colspan="6" class="empty-state">⏳ Carregando parceiros...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token_personalize');
        const API_BASE = '/api';

        if(!token) window.location.href='index.html';
        function logout() { localStorage.clear(); window.location.href='index.html'; }

        function toggleMenu() {
            document.getElementById('menuLinks').classList.toggle('ativo-mobile');
        }

        const Toast = Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true
        });

        // 1. CARREGAR PARCEIROS
        async function carregarParceiros() {
            try {
                const res = await fetch(`${API_BASE}/parceiros`, { headers: {'Authorization': `Bearer ${token}`} });
                const dados = await res.json();
                
                const tbody = document.getElementById('tabelaParceiros');
                tbody.innerHTML = '';

                if(dados.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhuma loja cadastrada ainda.</td></tr>';
                    return;
                }

                dados.forEach(p => {
                    let badgeClass = 'bg-ativo';
                    if (p.status === 'PENDENTE') badgeClass = 'bg-pendente';
                    if (p.status === 'INATIVO') badgeClass = 'bg-inativo';

                    // Tratamento para não exibir 'null' se o usuário ainda não tiver login definido
                    const usuarioExibicao = p.usuario ? `@${p.usuario}` : '<span style="color:#9ca3af; font-style:italic;">Não definido</span>';

                    // Passando os dados escapados para a função de edição
                    const pString = JSON.stringify(p).replace(/'/g, "\\'");

                    tbody.innerHTML += `
                        <tr>
                            <td><span class="badge-status ${badgeClass}">${p.status}</span></td>
                            <td><strong>${p.nome_loja}</strong></td>
                            <td>${p.responsavel}</td>
                            <td>${p.telefone || '-'}</td>
                            <td>${usuarioExibicao}</td>
                            <td>
                                <button title="Editar/Aprovar" class="btn-acao" onclick='abrirModalEdicao(${pString})'>✏️</button>
                                <button title="Excluir" class="btn-acao" onclick="excluirParceiro(${p.id})">🗑️</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                Toast.fire({ icon: 'error', title: 'Erro ao carregar lojas.' });
            }
        }

        // 2. MODAL DE EDIÇÃO COMPLETÃO (Aprovar / Editar Usuário)
        async function abrirModalEdicao(parceiro) {
            const { value: formValues } = await Swal.fire({
                title: '✏️ Editar / Aprovar Parceiro',
                html: `
                    <div style="display:flex; flex-direction:column; gap:12px; text-align:left; margin-top:10px;">
                        
                        <div>
                            <label style="font-size:12px; font-weight:bold; color:#4b5563;">Nome da Loja:</label>
                            <input id="swal-loja" class="swal2-input" style="margin:0; width:100%; height:40px; font-size:14px;" value="${parceiro.nome_loja || ''}">
                        </div>
                        
                        <div>
                            <label style="font-size:12px; font-weight:bold; color:#4b5563;">Nome do Responsável:</label>
                            <input id="swal-resp" class="swal2-input" style="margin:0; width:100%; height:40px; font-size:14px;" value="${parceiro.responsavel || ''}">
                        </div>

                        <div>
                            <label style="font-size:12px; font-weight:bold; color:#4b5563;">Telefone / WhatsApp:</label>
                            <input id="swal-tel" class="swal2-input" style="margin:0; width:100%; height:40px; font-size:14px;" value="${parceiro.telefone || ''}">
                        </div>

                        <hr style="border:0; border-top:1px dashed #cbd5e1; margin: 10px 0;">
                        
                        <div>
                            <label style="font-size:12px; font-weight:bold; color:#2563eb;">👤 Nome de Usuário (Para Acesso):</label>
                            <input id="swal-user" class="swal2-input" style="margin:0; width:100%; height:40px; font-size:14px; border-color:#93c5fd;" 
                                   value="${parceiro.usuario ? parceiro.usuario : ''}" placeholder="Ex: personalize.loja1">
                            <small style="color:#6b7280; font-size:11px;">E-mail de cadastro: ${parceiro.email_login || 'N/A'}</small>
                        </div>

                        <div>
                            <label style="font-size:12px; font-weight:bold; color:#4b5563;">Status no Sistema:</label>
                            <select id="swal-status" class="swal2-input" style="margin:0; width:100%; height:40px; font-size:14px;">
                                <option value="ATIVO" ${parceiro.status === 'ATIVO' ? 'selected' : ''}>🟢 ATIVO (Acesso Liberado)</option>
                                <option value="PENDENTE" ${parceiro.status === 'PENDENTE' ? 'selected' : ''}>🟠 PENDENTE (Em Análise)</option>
                                <option value="INATIVO" ${parceiro.status === 'INATIVO' ? 'selected' : ''}>🔴 INATIVO (Acesso Bloqueado)</option>
                            </select>
                        </div>
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '💾 Salvar Alterações',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#3b82f6',
                preConfirm: () => {
                    const usuario = document.getElementById('swal-user').value.trim();
                    const status = document.getElementById('swal-status').value;
                    
                    // Validação de segurança: Não pode aprovar sem criar um nome de usuário
                    if (status === 'ATIVO' && !usuario) {
                        Swal.showValidationMessage('Para ativar a loja, você precisa definir um Nome de Usuário!');
                        return false;
                    }
                    
                    return {
                        nome_loja: document.getElementById('swal-loja').value,
                        responsavel: document.getElementById('swal-resp').value,
                        telefone: document.getElementById('swal-tel').value,
                        usuario: usuario,
                        status: status
                    }
                }
            });

            if (formValues) {
                try {
                    const res = await fetch(`${API_BASE}/parceiros/${parceiro.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(formValues)
                    });
                    
                    if(res.ok) {
                        Toast.fire({ icon: 'success', title: 'Loja atualizada com sucesso!' });
                        carregarParceiros();
                    } else {
                        const erro = await res.json();
                        Swal.fire('Erro', erro.erro || 'Erro ao atualizar loja', 'error');
                    }
                } catch (err) {
                    Swal.fire('Erro', 'Falha na conexão', 'error');
                }
            }
        }

        // 3. EXCLUIR PARCEIRO
        async function excluirParceiro(id) {
            const confirmacao = await Swal.fire({
                title: 'Tem certeza?',
                text: "Isso deletará a loja, os usuários e o estoque consignado dela!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, excluir!',
                cancelButtonText: 'Cancelar'
            });

            if(confirmacao.isConfirmed) {
                try {
                    const res = await fetch(`${API_BASE}/parceiros/${id}`, { 
                        method: 'DELETE', 
                        headers: {'Authorization': `Bearer ${token}`} 
                    });
                    
                    if(res.ok) {
                        Toast.fire({ icon: 'success', title: 'Loja excluída!' });
                        carregarParceiros();
                    } else {
                        Swal.fire('Erro', 'Não foi possível excluir a loja.', 'error');
                    }
                } catch (err) {
                    Swal.fire('Erro', 'Falha na conexão.', 'error');
                }
            }
        }

        // 4. NOVA LOJA (Redireciona para um pop-up simples ou para a tela de registro futura se quiser)
        function abrirModalNovaLoja() {
            Swal.fire({
                title: 'Informação',
                text: 'Para cadastrar uma nova loja internamente, utilize a tela de Usuários, ou peça para a loja preencher o formulário na tela inicial (Quero ser Revendedor).',
                icon: 'info',
                confirmButtonText: 'Entendi'
            });
        }

        // Inicializa a tela
        carregarParceiros();
    </script>
</body>
</html>
