<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Parceiros - PERSONALIZE Hub</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            background: #f3f4f6;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: #1f2937;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #60a5fa;
            font-weight: 800;
        }

        .sidebar a {
            padding: 15px 20px;
            color: #d1d5db;
            text-decoration: none;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .sidebar a.ativo {
            background: #374151;
            border-left-color: #3b82f6;
            color: #fff;
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        .btn-add {
            background: #3b82f6;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            grid-column: span 2;
        }

        .btn-add:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
        }

        .status-ativo {
            background: #dcfce7;
            color: #166534;
        }

        .status-pendente {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>PERSONALIZE</h2>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="produtos.html">📦 Produtos & Peças</a>
        <a href="parceiros.html" class="ativo">🏪 Lojas Parceiras</a>
        <a href="usuarios.html">👥 Usuários do Sistema</a>
        <a href="remessas.html">🚚 Remessas (Estoque)</a>
        <a href="vendas.html">💰 Frente de Caixa</a>
        <a onclick="logout()" style="cursor:pointer; margin-top:auto; color: #f87171; padding: 15px 20px;">🚪 Sair</a>
    </div>

    <div class="main">
        <div class="card">
            <h2>🏪 Cadastrar Nova Loja Parceira</h2><br>
            <form id="formLoja">
                <input type="text" id="nome_loja" placeholder="Nome da Loja" required>
                <input type="text" id="responsavel" placeholder="Responsável" required>
                <input type="text" id="telefone" placeholder="Telefone/WhatsApp" required>
                <input type="email" id="email" placeholder="E-mail de Login" required>
                <input type="password" id="senha" placeholder="Senha de Acesso" style="grid-column: span 2;" required>
                <button type="submit" class="btn-add" id="btnSalvar">Adicionar Parceiro</button>
            </form>
        </div>

        <div class="card">
            <h2>📋 Lojas Ativas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Loja</th>
                        <th>Responsável / E-mail</th>
                        <th>WhatsApp</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaLojas">
                    <tr>
                        <td colspan="5" style="text-align:center; padding:20px;">Carregando parceiros...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token_personalize');
        const API_URL = '/api/parceiros';

        if (!token) window.location.href = 'index.html';
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }

        // --- 1. CARREGAR LOJAS ---
        async function carregarLojas() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401 || res.status === 403) logout();

                const lojas = await res.json();
                const tbody = document.getElementById('tabelaLojas');
                tbody.innerHTML = lojas.length === 0 ? '<tr><td colspan="5" style="text-align:center;">Nenhuma loja cadastrada.</td></tr>' : '';

                lojas.forEach(l => {
                    const statusClass = l.status === 'ATIVO' ? 'status-ativo' : 'status-pendente';
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${l.nome_loja}</strong></td>
                            <td>${l.responsavel}<br><small>${l.email_login || 'Sem e-mail'}</small></td>
                            <td>${l.telefone}</td>
                            <td><span class="status-badge ${statusClass}">${l.status}</span></td>
                            <td>
                                <button onclick="editarLoja(${l.id}, '${l.nome_loja}')" style="color: #3b82f6; cursor:pointer; background:none; border:none; font-weight:bold; font-size:18px;">✏️</button>
                                <button onclick="deletarLoja(${l.id})" style="color: #ef4444; cursor:pointer; background:none; border:none; font-weight:bold; font-size:18px; margin-left:10px;">🗑️</button>
                            </td>
                        </tr>`;
                });
            } catch (err) {
                console.error("Erro ao carregar lojas:", err);
                document.getElementById('tabelaLojas').innerHTML = '<tr><td colspan="5" style="color:red; text-align:center;">Erro ao conectar com o servidor.</td></tr>';
            }
        }

        // --- 2. CADASTRAR LOJA ---
        document.getElementById('formLoja').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.textContent = "⏳ Cadastrando...";

            const payload = {
                nome_loja: document.getElementById('nome_loja').value,
                responsavel: document.getElementById('responsavel').value,
                telefone: document.getElementById('telefone').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    alert("✅ Loja cadastrada com sucesso!");
                    document.getElementById('formLoja').reset();
                    carregarLojas();
                } else {
                    alert("❌ Erro: " + (data.erro || "Não foi possível cadastrar."));
                }
            } catch (err) {
                alert("❌ Erro de conexão. Verifique se o servidor está rodando.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Adicionar Parceiro";
            }
        });

        // --- 3. EXCLUIR LOJA ---
        async function deletarLoja(id) {
            if (confirm("⚠️ Tem certeza? Isso removerá o acesso da loja e todo o histórico de estoque!")) {
                try {
                    const res = await fetch(`${API_URL}/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) carregarLojas();
                    else alert("Erro ao excluir.");
                } catch (err) { alert("Erro de rede."); }
            }
        }

        // --- 4. EDITAR LOJA ---
        async function editarLoja(id, nomeAtual) {
            const novoNome = prompt("Novo nome da loja:", nomeAtual);
            if (!novoNome || novoNome === nomeAtual) return;

            try {
                const res = await fetch(`/api/parceiros/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nome_loja: novoNome })
                });

                if (res.ok) {
                    alert("✅ Atualizado!");
                    carregarLojas(); // Recarrega a lista
                } else {
                    const erro = await res.json();
                    alert("❌ Erro: " + erro.erro);
                }
            } catch (err) {
                alert("❌ Erro de conexão.");
            }
        }

        carregarLojas();
    </script>
</body>

</html>
