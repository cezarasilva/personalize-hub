<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parceiros - PERSONALIZE Hub</title>
    
    <!-- SweetAlert2 para Alertas Modernos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        /* ==========================================
           🖥️ MODO DESKTOP (PC) 
           ========================================== */
        body { display: flex; background: #f3f4f6; height: 100vh; overflow: hidden; flex-direction: row; }
        
        .sidebar { width: 250px; background: #1f2937; color: #fff; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-top { padding: 25px 20px; text-align: center; background: #111827; }
        .sidebar-top h2 { color: #60a5fa; font-weight: 800; font-size: 1.5rem; margin: 0; }
        .btn-menu { display: none; } 
        
        .sidebar-links { display: flex; flex-direction: column; flex: 1; overflow-y: auto; }
        .sidebar a { padding: 15px 20px; color: #d1d5db; text-decoration: none; border-left: 4px solid transparent; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .sidebar a:hover { background: #374151; color: #fff; }
        .sidebar a.ativo { background: #374151; border-left-color: #3b82f6; color: #fff; }
        .btn-sair { margin-top: auto; color: #f87171 !important; border-top: 1px solid #374151; }

        .main { flex: 1; overflow-y: auto; padding: 30px; }
        
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); margin-bottom: 25px; border: 1px solid #e5e7eb; }
        
        /* Formulário */
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input { padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; background: #f9fafb; font-size: 14px; width: 100%; }
        input:focus { border-color: #3b82f6; background: #fff; }
        
        .btn-add { background: #3b82f6; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; grid-column: span 2; transition: 0.2s; }
        .btn-add:hover { background: #2563eb; }
        .btn-add:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Tabela */
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 600px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f9fafb; color: #6b7280; font-size: 12px; font-weight: 600; text-transform: uppercase; }

        /* Badges de Status */
        .status-badge { padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 11px; text-transform: uppercase; white-space: nowrap; }
        .status-ativo { background: #dcfce7; color: #166534; }
        .status-pendente { background: #fef3c7; color: #92400e; }
        
        .btn-acao { background: none; border: none; cursor: pointer; font-size: 18px; margin-right: 10px; transition: 0.2s; }
        .btn-acao:hover { transform: scale(1.2); }

        /* ==========================================
           📱 MODO CELULAR (Menu Hamburguer Funcional)
           ========================================== */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: visible; }
            
            .sidebar { width: 100%; height: auto; position: relative; overflow: visible; }
            .sidebar-top { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #111827; }
            .sidebar-top h2 { font-size: 1.3rem; text-align: left; }
            
            .btn-menu { 
                display: flex; background: #3b82f6; color: white; border: none; font-size: 24px; 
                width: 40px; height: 40px; border-radius: 6px; align-items: center; justify-content: center; 
                cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }
            
            .sidebar-links { 
                display: none; position: absolute; top: 100%; left: 0; width: 100%; 
                background: #1f2937; box-shadow: 0 10px 15px rgba(0,0,0,0.5); z-index: 9999; 
            }
            .sidebar-links.ativo-mobile { display: flex !important; }

            .sidebar a { padding: 15px 20px; border-bottom: 1px solid #374151; border-left: none; }
            .sidebar a.ativo { border-left: none; background: #374151; border-left: 4px solid #3b82f6; }
            
            .main { padding: 15px; overflow-y: visible; }
            .card { padding: 15px; }
            
            /* Ajusta o formulário para ficar um campo embaixo do outro */
            form { grid-template-columns: 1fr; }
            .btn-add { grid-column: span 1; }
            
            /* Ajusta a senha no celular */
            #senha { grid-column: span 1 !important; }
        }
    </style>
</head>

<body>
    <!-- BARRA SUPERIOR (Mobile) / LATERAL (PC) -->
    <div class="sidebar">
        <div class="sidebar-top">
            <h2>PERSONALIZE</h2>
            <button class="btn-menu" onclick="toggleMenu()">☰</button>
        </div>
        <div class="sidebar-links" id="menuLinks">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="produtos.html">📦 Produtos & Peças</a>
            <a href="parceiros.html" class="ativo">🏪 Lojas Parceiras</a>
            <a href="usuarios.html">👥 Usuários do Sistema</a>
            <a href="remessas.html">🚚 Remessas (Estoque)</a>
            <a href="vendas.html">💰 Frente de Caixa</a>
            <a class="btn-sair" onclick="logout()">🚪 Sair</a>
        </div>
    </div>

    <div class="main">
        <div class="card">
            <h2>🏪 Cadastrar Nova Loja Parceira</h2><br>
            <form id="formLoja">
                <input type="text" id="nome_loja" placeholder="Nome da Loja" required>
                <input type="text" id="responsavel" placeholder="Responsável" required>
                <input type="text" id="telefone" placeholder="Telefone/WhatsApp" required>
                <input type="email" id="email" placeholder="E-mail de Login" required>
                <input type="password" id="senha" placeholder="Senha de Acesso" style="grid-column: span 2;" required>
                <button type="submit" class="btn-add" id="btnSalvar">Adicionar Parceiro</button>
            </form>
        </div>

        <div class="card">
            <h2>📋 Lojas Ativas e Pendentes</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Loja</th>
                            <th>Responsável / E-mail</th>
                            <th>WhatsApp</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaLojas">
                        <tr>
                            <td colspan="5" style="text-align:center; padding:20px;">Carregando parceiros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token_personalize');
        const API_URL = '/api/parceiros';

        if (!token) window.location.href = 'index.html';
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }

        // 🍔 Função do Menu Hamburguer
        function toggleMenu() {
            const menu = document.getElementById('menuLinks');
            menu.classList.toggle('ativo-mobile');
        }

        // Configuração do SweetAlert (Toasts flutuantes)
        const Toast = Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true
        });

        // --- 1. CARREGAR LOJAS ---
        async function carregarLojas() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401 || res.status === 403) logout();

                const lojas = await res.json();
                const tbody = document.getElementById('tabelaLojas');
                tbody.innerHTML = lojas.length === 0 ? '<tr><td colspan="5" style="text-align:center; color:#9ca3af;">Nenhuma loja cadastrada.</td></tr>' : '';

                lojas.forEach(l => {
                    const statusClass = l.status === 'ATIVO' ? 'status-ativo' : 'status-pendente';
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${l.nome_loja}</strong></td>
                            <td>${l.responsavel}<br><small style="color:#6b7280;">${l.email_login || 'Sem e-mail'}</small></td>
                            <td>${l.telefone}</td>
                            <td><span class="status-badge ${statusClass}">${l.status}</span></td>
                            <td>
                                <button class="btn-acao" onclick="editarLoja(${l.id}, '${l.nome_loja}')" title="Editar Nome">✏️</button>
                                <button class="btn-acao" onclick="deletarLoja(${l.id})" title="Excluir Loja">🗑️</button>
                            </td>
                        </tr>`;
                });
            } catch (err) {
                console.error("Erro ao carregar lojas:", err);
                document.getElementById('tabelaLojas').innerHTML = '<tr><td colspan="5" style="color:red; text-align:center;">Erro ao conectar com o servidor.</td></tr>';
            }
        }

        // --- 2. CADASTRAR LOJA ---
        document.getElementById('formLoja').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.textContent = "⏳ Cadastrando...";

            const payload = {
                nome_loja: document.getElementById('nome_loja').value,
                responsavel: document.getElementById('responsavel').value,
                telefone: document.getElementById('telefone').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    Toast.fire({ icon: 'success', title: '✅ Loja cadastrada com sucesso!' });
                    document.getElementById('formLoja').reset();
                    carregarLojas();
                } else {
                    Swal.fire({ icon: 'error', title: 'Atenção!', text: data.erro || "Não foi possível cadastrar." });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Erro de conexão', text: 'Verifique se o servidor está rodando.' });
            } finally {
                btn.disabled = false;
                btn.textContent = "Adicionar Parceiro";
            }
        });

        // --- 3. EXCLUIR LOJA ---
        async function deletarLoja(id) {
            const confirmacao = await Swal.fire({
                title: 'Excluir Loja?',
                text: "Isso removerá o acesso da loja e todo o histórico de estoque associado!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, excluir!',
                cancelButtonText: 'Cancelar'
            });

            if (confirmacao.isConfirmed) {
                try {
                    const res = await fetch(`${API_URL}/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (res.ok) {
                        Toast.fire({ icon: 'success', title: 'Loja removida!' });
                        carregarLojas();
                    } else {
                        Swal.fire({ icon: 'error', title: 'Erro ao excluir' });
                    }
                } catch (err) { 
                    Swal.fire({ icon: 'error', title: 'Erro de rede' }); 
                }
            }
        }

        // --- 4. EDITAR LOJA ---
        async function editarLoja(id, nomeAtual) {
            const { value: novoNome } = await Swal.fire({
                title: 'Editar Nome da Loja',
                input: 'text',
                inputLabel: 'Atualize o nome desta loja',
                inputValue: nomeAtual,
                showCancelButton: true,
                confirmButtonText: 'Salvar',
                cancelButtonText: 'Cancelar',
                inputValidator: (value) => {
                    if (!value) return 'O nome da loja não pode ficar vazio!'
                }
            });

            if (novoNome && novoNome !== nomeAtual) {
                try {
                    const res = await fetch(`/api/parceiros/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ nome_loja: novoNome })
                    });

                    if (res.ok) {
                        Toast.fire({ icon: 'success', title: 'Loja atualizada!' });
                        carregarLojas();
                    } else {
                        const erro = await res.json();
                        Swal.fire({ icon: 'error', title: 'Erro', text: erro.erro });
                    }
                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'Erro de conexão' });
                }
            }
        }

        carregarLojas();
    </script>
</body>
</html>
