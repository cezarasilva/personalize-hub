<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Remessas - PERSONALIZE Hub</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { display: flex; background: #f3f4f6; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: #1f2937; color: #fff; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; color: #60a5fa; font-weight: 800; }
        .sidebar a { padding: 15px 20px; color: #d1d5db; text-decoration: none; border-left: 4px solid transparent; cursor: pointer; }
        .sidebar a.ativo { background: #374151; border-left-color: #3b82f6; color: #fff; }
        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e5e7eb;}
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; align-items: end; }
        select, input { padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 14px; }
        .btn-send { background: #3b82f6; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-send:hover { background: #2563eb; }
        .btn-pdf { background: #1f2937; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; display: none; }
        .btn-pdf:hover { background: #111827; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f9fafb; color: #6b7280; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .badge-qtd { background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }
        .empty-state { text-align: center; padding: 30px; color: #9ca3af; font-size: 14px; }
        .btn-acao { background: none; border: none; cursor: pointer; font-size: 16px; margin-left: 10px; transition: 0.2s; }
        .btn-acao:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>PERSONALIZE</h2>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="produtos.html">📦 Produtos & Peças</a>
        <a href="parceiros.html">🏪 Lojas Parceiras</a>
        <a href="usuarios.html">👥 Usuários do Sistema</a>
        <a href="remessas.html" class="ativo">🚚 Remessas (Estoque)</a>
        <a href="vendas.html">💰 Frente de Caixa</a>
        <a onclick="logout()" style="margin-top:auto; color: #f87171; padding: 15px 20px; cursor: pointer;">🚪 Sair</a>
    </div>

    <div class="main">
        <div class="card">
            <h2>🚚 Nova Remessa para Loja</h2><br>
            <form id="formRem" class="form-grid">
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size: 12px; font-weight: bold;">Loja de Destino:</label>
                    <select id="parc" required><option value="">Selecione a Loja...</option></select>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size: 12px; font-weight: bold;">Produto/Peça:</label>
                    <select id="prod" required><option value="">Escolha a Peça...</option></select>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size: 12px; font-weight: bold;">Qtd. a Enviar:</label>
                    <input type="number" id="qtd" placeholder="0" min="1" required>
                </div>
                <button type="submit" class="btn-send" id="btnEnviar" style="grid-column: span 3; margin-top: 10px;">Confirmar Envio de Remessa</button>
            </form>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>📋 Estoque Consignado Atual</h2>
                <button id="btnImprimir" class="btn-pdf" onclick="gerarPDF()">🖨️ Imprimir Recibo PDF</button>
            </div>
            
            <div style="margin-top: 5px;">
                <select id="filtroParc" style="width: 100%; max-width: 400px;">
                    <option value="">Selecione para ver o estoque...</option>
                </select>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Peça / Produto</th>
                        <th>Variação</th>
                        <th>Qtd. na Loja</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabEst">
                    <tr><td colspan="4" class="empty-state">Selecione uma loja para ver o estoque atual.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token_personalize');
        const API_BASE = '/api';

        if(!token) window.location.href='index.html';
        function logout() { localStorage.clear(); window.location.href='index.html'; }

        // --- 1. CARREGAR SELECTS ---
        async function carregarDados() {
            try {
                const resPa = await fetch(`${API_BASE}/parceiros`, { headers: {'Authorization': `Bearer ${token}`} });
                const parceiros = await resPa.json();
                let optPa = '<option value="">Selecione a Loja...</option>';
                parceiros.forEach(p => {
                    if(p.status && p.status.toUpperCase() === 'ATIVO') {
                        optPa += `<option value="${p.id}">${p.nome_loja}</option>`;
                    }
                });
                document.getElementById('parc').innerHTML = optPa;
                document.getElementById('filtroParc').innerHTML = optPa;

                const resPr = await fetch(`${API_BASE}/produtos`, { headers: {'Authorization': `Bearer ${token}`} });
                const prods = await resPr.json();
                let optPr = '<option value="">Escolha a Peça...</option>';
                prods.forEach(p => {
                    optPr += `<option value="${p.id}">${p.nome} (${p.variacao}) - Disp: ${p.estoque_central}</option>`;
                });
                document.getElementById('prod').innerHTML = optPr;
            } catch (err) { console.error(err); }
        }

        // --- 2. ENVIAR REMESSA ---
        document.getElementById('formRem').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;

            const payload = { 
                parceiro_id: document.getElementById('parc').value, 
                produto_id: document.getElementById('prod').value, 
                quantidade: document.getElementById('qtd').value 
            };

            try {
                const res = await fetch(`${API_BASE}/consignacoes`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert('✅ Remessa enviada!');
                    document.getElementById('formRem').reset();
                    carregarDados();
                    
                    // Se a loja enviada for a mesma que está filtrada na tabela, recarrega a tabela
                    if(document.getElementById('filtroParc').value === payload.parceiro_id) {
                        document.getElementById('filtroParc').dispatchEvent(new Event('change'));
                    }
                }
            } catch (err) { alert('Erro de conexão.'); }
            finally { btn.disabled = false; }
        });

        // --- 3. FILTRAR ESTOQUE ---
        document.getElementById('filtroParc').addEventListener('change', async (e) => {
            const lojaId = e.target.value;
            const btnPdf = document.getElementById('btnImprimir');
            
            if(!lojaId) {
                btnPdf.style.display = 'none';
                document.getElementById('tabEst').innerHTML = '<tr><td colspan="4" class="empty-state">Selecione uma loja para ver o estoque atual.</td></tr>';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/consignacoes/${lojaId}`, { headers: {'Authorization': `Bearer ${token}`} });
                const est = await res.json();
                const tbody = document.getElementById('tabEst'); 
                
                if (est.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Sem estoque consignado.</td></tr>';
                    btnPdf.style.display = 'none';
                    return;
                }

                btnPdf.style.display = 'block'; // Mostra o botão de PDF
                tbody.innerHTML = '';
                est.forEach(i => {
                    tbody.innerHTML += `
                        <tr class="linha-produto">
                            <td class="td-nome"><strong>${i.produto_nome}</strong></td>
                            <td class="td-var">${i.variacao}</td>
                            <td class="td-qtd"><span class="badge-qtd">${i.quantidade_atual} un.</span></td>
                            <td>
                                <button title="Ajustar Qtd" class="btn-acao" onclick="ajustarRemessa(${i.id}, ${i.quantidade_atual})">✏️</button>
                                <button title="Excluir/Estornar" class="btn-acao" onclick="excluirRemessa(${i.id})">🗑️</button>
                            </td>
                        </tr>`;
                });
            } catch (err) { console.error(err); }
        });

        // --- NOVAS FUNÇÕES ---
        async function excluirRemessa(id) {
            if(!confirm("⚠️ Deseja estornar esta remessa? O estoque voltará para o centro.")) return;
            const res = await fetch(`${API_BASE}/consignacoes/${id}`, { method: 'DELETE', headers: {'Authorization': `Bearer ${token}`} });
            if(res.ok) { document.getElementById('filtroParc').dispatchEvent(new Event('change')); carregarDados(); }
        }

        async function ajustarRemessa(id, qtdAtual) {
            const novaQtd = prompt("Qual a nova quantidade total na loja?", qtdAtual);
            if(novaQtd === null || novaQtd == qtdAtual) return;
            const res = await fetch(`${API_BASE}/consignacoes/${id}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ nova_quantidade: parseInt(novaQtd) })
            });
            if(res.ok) document.getElementById('filtroParc').dispatchEvent(new Event('change'));
            else { const erro = await res.json(); alert("❌ " + erro.erro); }
        }

        // ==========================================
        // 🖨️ FUNÇÃO MAGNÍFICA DO PDF
        // ==========================================
        function gerarPDF() {
            // Importa as funções da biblioteca jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Pega o nome da loja selecionada no filtro
            const selectLoja = document.getElementById('filtroParc');
            const nomeLoja = selectLoja.options[selectLoja.selectedIndex].text;
            
            // Pega a data e hora de hoje
            const dataAtual = new Date().toLocaleDateString('pt-BR');
            const horaAtual = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            // 1. Cabeçalho do PDF
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("PERSONALIZE 3D", 105, 20, { align: "center" }); // Título Centralizado
            
            doc.setFontSize(14);
            doc.text("RECIBO DE ESTOQUE / CONSIGNAÇÃO", 105, 30, { align: "center" });

            // 2. Informações da Remessa
            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);
            doc.text(`Empresa Parceira: ${nomeLoja}`, 14, 45);
            doc.text(`Data da Conferência: ${dataAtual} às ${horaAtual}`, 14, 53);

            // 3. Montando os dados da tabela extraindo do HTML atual
            const linhasPdf = [];
            document.querySelectorAll('.linha-produto').forEach(tr => {
                const nomeProd = tr.querySelector('.td-nome').innerText;
                const variacao = tr.querySelector('.td-var').innerText;
                const qtd = tr.querySelector('.td-qtd').innerText;
                linhasPdf.push([nomeProd, variacao, qtd]);
            });

            // 4. Desenhando a Tabela no PDF
            doc.autoTable({
                startY: 60,
                head: [['Produto', 'Variação / Modelo', 'Quantidade']],
                body: linhasPdf,
                theme: 'grid',
                headStyles: { fillColor: [59, 130, 246] }, // Azul combinando com o sistema
                styles: { fontSize: 11 }
            });

            // 5. Linhas de Assinatura
            // Pega a posição Y final de onde a tabela terminou para desenhar as assinaturas embaixo
            const finalY = doc.lastAutoTable.finalY + 40; 

            doc.setLineWidth(0.5);
            
            // Assinatura 1 (Sua)
            doc.line(20, finalY, 90, finalY);
            doc.text("PERSONALIZE 3D", 35, finalY + 7);
            doc.setFontSize(10);
            doc.text("Entregador / Conferente", 33, finalY + 12);

            // Assinatura 2 (Da Loja)
            doc.setFontSize(12);
            doc.line(120, finalY, 190, finalY);
            
            // Quebra o nome da loja se for muito grande
            const nomeLojaCurto = nomeLoja.length > 25 ? nomeLoja.substring(0, 25) + '...' : nomeLoja;
            doc.text(nomeLojaCurto, 135, finalY + 7);
            
            doc.setFontSize(10);
            doc.text("Responsável pelo Recebimento", 125, finalY + 12);

            // 6. Baixando o arquivo mágico
            doc.save(`Recibo_Estoque_${nomeLoja.replace(/\s+/g, '_')}_${dataAtual.replace(/\//g, '-')}.pdf`);
        }

        carregarDados();
    </script>
</body>
</html>
