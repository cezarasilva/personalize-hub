<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máquinas - PERSONALIZE Hub</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/theme.js"></script>
</head>
<body>
<div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
        <header class="page-header">
            <div class="page-title">
                <h1><i class="bx bx-printer"></i> Máquinas</h1>
                <p>Cadastre equipamentos para calcular custo/hora com depreciação, energia e manutenção.</p>
            </div>
        </header>

        <section class="card">
            <div class="card-title"><span id="tituloMaquina">Cadastrar máquina</span><button type="button" class="btn btn-light hidden" id="btnCancelarEdicaoMaquina">Cancelar edição</button></div>
            <form id="formMaquina">
                <input type="hidden" id="maquina_id">
                <div class="form-grid">
                    <div class="form-group"><label>Nome da máquina</label><input id="nome" required placeholder="Ex: Bambu Lab A1"></div>
                    <div class="form-group"><label>Modelo</label><input id="modelo" placeholder="Ex: A1 Combo"></div>
                    <div class="form-group"><label>Tipo</label><select id="tipo"><option value="IMPRESSORA_3D">Impressora 3D</option><option value="PLOTTER">Plotter</option><option value="LASER">Laser</option><option value="PRENSA">Prensa</option><option value="OUTRA">Outra</option></select></div>
                    <div class="form-group"><label>Valor de compra</label><input id="valor_compra" type="number" step="0.01" min="0" value="0"></div>
                    <div class="form-group"><label>Vida útil estimada (horas)</label><input id="vida_util_horas" type="number" step="0.01" min="0" value="20000"></div>
                    <div class="form-group"><label>Potência média (kW)</label><input id="potencia_kw" type="number" step="0.0001" min="0" value="0.20"></div>
                    <div class="form-group"><label>Valor energia (R$/kWh)</label><input id="valor_kwh" type="number" step="0.0001" min="0" value="0.90"></div>
                    <div class="form-group"><label>Manutenção/insumos por hora</label><input id="custo_manutencao_hora" type="number" step="0.01" min="0" value="0"></div>
                    <div class="form-group"><label>Status</label><select id="status"><option value="ATIVA">ATIVA</option><option value="INATIVA">INATIVA</option><option value="MANUTENCAO">MANUTENÇÃO</option></select></div>
                    <div class="form-group"><label><input id="usar_custo_manual" type="checkbox"> Usar custo/hora manual</label><input id="custo_hora_manual" type="number" step="0.01" min="0" placeholder="Ex: 1,00"></div>
                </div>
                <div class="pricing-result mt-3">
                    <div><small>Depreciação/h</small><strong id="resDepreciacao">R$ 0,00</strong></div>
                    <div><small>Energia/h</small><strong id="resEnergia">R$ 0,00</strong></div>
                    <div><small>Manutenção/h</small><strong id="resManutencao">R$ 0,00</strong></div>
                    <div><small>Custo/h final</small><strong id="resCustoHora">R$ 0,00</strong></div>
                </div>
                <button class="btn btn-primary w-full mt-3" id="btnSalvarMaquina">Salvar máquina</button>
            </form>
        </section>

        <section class="card">
            <div class="card-title"><span>Máquinas cadastradas</span></div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Máquina</th><th>Tipo</th><th>Custo/h</th><th>Detalhes</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="tabelaMaquinas"><tr><td colspan="6">Carregando...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/maquinas.js"></script>
</body>
</html>
