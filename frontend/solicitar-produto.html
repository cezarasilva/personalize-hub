<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Solicitar Produto - PERSONALIZE Hub</title>
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" href="assets/icons/favicon-32.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="P-HUB"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/app.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>    <script src="/assets/js/theme.js"></script>
</head>
<body><div class="layout"><aside id="sidebar" class="sidebar"></aside><main class="main"><header class="page-header"><div class="page-title"><h1><i class="bx bx-message-square-add"></i> Solicitar Produto</h1><p>Peça reposição, modelos novos ou uma cotação com imagem e descrição.</p></div><a class="btn btn-dark" href="minhas-cotacoes.html">Ver minhas solicitações</a></header><section class="grid grid-2"><div class="card"><div class="card-title"><i class="bx bx-message-square-add"></i> Solicitar produto/modelo</div><form id="formSolicitacao"><div class="form-group"><label>Produto do catálogo, se existir</label><div class="search-wrap"><input id="buscaProduto" placeholder="Digite para buscar produto existente"><div id="sugestoes" class="suggestions" style="display:none"></div></div><input type="hidden" id="produtoId"><input type="hidden" id="variacaoId"></div><div class="form-group"><label>Modelo desejado, se não existir no catálogo</label><input id="modeloDesejado" placeholder="Ex.: chaveiro de personagem, suporte, etiqueta..."></div><div class="form-grid"><div class="form-group"><label>Quantidade desejada</label><input id="qtdSolicitada" type="number" min="1" value="5"></div><div class="form-group"><label>Tipo</label><select id="tipoSolicitacao"><option value="REPOSICAO">Reposição / mais unidades</option><option value="NOVO_MODELO">Modelo novo</option></select></div></div><div class="form-group"><label>Observação</label><textarea id="obsSolicitacao" placeholder="Cores, tamanho, urgência, preferência..."></textarea></div><button class="btn btn-success w-full" type="submit">Enviar solicitação</button></form></div><div class="card"><div class="card-title"><i class="bx bx-palette"></i> Cotar produto personalizado</div><form id="formCotacao" enctype="multipart/form-data"><div class="form-group"><label>Título do produto</label><input name="titulo" required placeholder="Ex.: adesivo personalizado para pote"></div><div class="form-grid"><div class="form-group"><label>Quantidade</label><input name="quantidade" type="number" min="1" value="1"></div><div class="form-group"><label>Prazo desejado</label><input name="prazo_desejado" type="date"></div></div><div class="form-group"><label>Imagem de referência JPEG/PNG</label><input name="imagem" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="form-group"><label>Descrição detalhada</label><textarea name="descricao" required placeholder="Descreva tamanho, material, cor, onde será usado, acabamento e qualquer detalhe importante."></textarea></div><button class="btn btn-primary w-full" type="submit">Enviar cotação</button></form></div></section></main></div><script src="assets/js/core.js"></script><script src="assets/js/pages/solicitar-produto.js"></script></body></html>
