<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - PERSONALIZE Hub</title>
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" href="assets/icons/favicon-32.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="P-HUB">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="/assets/js/theme.js"></script>
</head>
<body class="auth-body">
    <main class="auth-box">
        <section class="auth-brand">
            <h2>Recuperar senha</h2>
            <p>Digite seu e-mail cadastrado para receber o link seguro.</p>
        </section>
        <form id="formRecuperar">
            <div class="form-group">
                <label for="email">E-mail de recuperação</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-full mt-3" id="btnEnviar">Enviar link</button>
        </form>
        <div id="mensagem" class="msg"></div>
        <footer class="auth-footer"><a href="index.html">← Voltar para o login</a></footer>
    </main>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/pages/recuperar.js"></script>
</body>
</html>
