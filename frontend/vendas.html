<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas - PERSONALIZE Hub</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="/assets/js/theme.js"></script>
</head>
<body>
    <div class="layout">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main">
            <header class="page-header">
                <div class="page-title">
                    <h1> Frente de Caixa</h1>
                    <p>Registre vendas com busca digitável de produto e acompanhe o extrato.</p>
                </div>
                <button class="btn btn-dark" id="btnPdfVendas">Fechamento PDF</button>
            </header>

            <section class="card">
                <div class="card-title">Registrar venda</div>
                <form id="formVenda">
                    <div class="form-grid mt-2">
                        <div class="form-group" id="grupoOrigemVenda">
                            <label for="origemVenda">Venda por</label>
                            <select id="origemVenda" name="parceiro_id">
                                <option value="">Sede Central</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="quantidadeVenda">Quantidade</label>
                            <input id="quantidadeVenda" name="quantidade" type="number" min="1" value="1" required>
                        </div>
                        <div class="form-group hidden" id="grupoValorFinalVenda">
                            <label for="valorFinalVenda">Valor total final da venda direta</label>
                            <input id="valorFinalVenda" name="valor_total_manual" type="text" inputmode="decimal" placeholder="Ex: 39,90">
                            <small class="text-muted">Esse é o valor TOTAL que será registrado na venda. Aceita 39,90 ou 39.90.</small>
                            <div id="resumoValorVenda" class="text-success mt-1"></div>
                        </div>
                    </div>

                    <div class="form-group search-wrap mt-2">
                        <label for="buscaProdutoVenda">Produto</label>
                        <input id="buscaProdutoVenda" type="search" placeholder="Digite o nome, variação ou SKU do produto..." autocomplete="off" required>
                        <div id="sugestoesProdutoVenda" class="suggestions hidden"></div>
                    </div>

                    <div id="produtoVendaSelecionadoBox" class="preview-box mt-2 hidden"></div>

                    <button class="btn btn-success w-full mt-3" id="btnConfirmarVenda">Confirmar venda</button>
                </form>
            </section>

            <section class="card">
                <div class="card-title">Extrato de vendas</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Data</th>
                                <th>Qtd</th>
                                <th>Total</th>
                                <th>Origem</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaVendas"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/pages/vendas.js"></script>
</body>
</html>
