<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frente de Caixa - PERSONALIZE Hub</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { display: flex; background: #f3f4f6; height: 100vh; overflow: hidden; }
        
        /* Menu Lateral */
        .sidebar { width: 250px; background: #1f2937; color: #fff; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; color: #60a5fa; font-weight: 800; }
        .sidebar a { padding: 15px 20px; color: #d1d5db; text-decoration: none; border-left: 4px solid transparent; cursor: pointer; }
        .sidebar a:hover { background: #374151; color: #fff; }
        .sidebar a.ativo { background: #374151; border-left-color: #3b82f6; color: #fff; }
        
        /* Área Principal */
        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e5e7eb;}
        
        /* Formulário de Venda */
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 14px; }
        .btn-vender { background: #10b981; color: white; padding: 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; grid-column: span 2; font-size: 16px; transition: 0.2s; }
        .btn-vender:hover { background: #059669; }
        
        /* Botão PDF */
        .btn-pdf { background: #1f2937; color: white; padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-pdf:hover { background: #111827; }

        /* Preview da Foto */
        .preview-container { display: flex; align-items: center; gap: 15px; grid-column: span 2; background: #f9fafb; padding: 12px; border-radius: 8px; border: 1px dashed #d1d5db; min-height: 80px; }
        #fotoPreview { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; display: none; }
        .no-photo { width: 65px; height: 65px; background: #e5e7eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #6b7280; text-align: center; }

        /* Tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background: #f9fafb; color: #6b7280; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .foto-venda { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
        .badge-loja { background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
        
        .btn-acao { border: none; background: none; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-acao:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>PERSONALIZE</h2>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="produtos.html" class="menu-admin">📦 Produtos & Peças</a>
        <a href="parceiros.html" class="menu-admin">🏪 Lojas Parceiras</a>
        <a href="remessas.html" class="menu-admin">🚚 Remessas (Estoque)</a>
        <a href="vendas.html" class="ativo">💰 Frente de Caixa</a>
        <a onclick="logout()" style="margin-top:auto; color: #f87171; cursor: pointer;">🚪 Sair</a>
    </div>

    <div class="main">
        <div class="card">
            <h2 style="margin-bottom: 15px;">🛒 Registrar Nova Venda</h2>
            <form id="formVenda">
                <div class="preview-container">
                    <img id="fotoPreview" src="" alt="Produto">
                    <div id="placeholderFoto" class="no-photo">Selecione<br>Peça</div>
                    <select id="produto" required style="flex: 1;" onchange="atualizarPreview()">
                        <option value="">Carregando produtos...</option>
                    </select>
                </div>

                <input type="number" id="quantidade" placeholder="Quantidade vendida" min="1" value="1" required>
                
                <select id="venda_origem" class="menu-admin">
                    <option value="">Venda Direta (Estoque Central)</option>
                </select>

                <button type="submit" class="btn-vender" id="btnVender">💸 Confirmar Venda</button>
            </form>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0;">📜 Extrato Recente de Vendas</h2>
                <button class="btn-pdf" onclick="gerarPDF()">🖨️ Imprimir Fechamento</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Data/Hora</th>
                        <th>Qtd</th>
                        <th>Total</th>
                        <th class="col-loja">Loja</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaVendas"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = '/api';
        const token = localStorage.getItem('token_personalize');
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario_personalize') || '{}');
        let produtosGlobais = [];

        if(!token) window.location.href='index.html';

        if (usuarioLogado.perfil === 'PARCEIRO') {
            document.querySelectorAll('.menu-admin').forEach(el => el.style.display = 'none');
            const colLoja = document.querySelector('.col-loja');
            if(colLoja) colLoja.style.display = 'none';
        }

        function logout() { localStorage.clear(); window.location.href='index.html'; }

        async function carregarProdutos() {
            try {
                const endpoint = (usuarioLogado.perfil === 'PARCEIRO') 
                    ? `${API}/consignacoes/${usuarioLogado.parceiro_id}` 
                    : `${API}/produtos`;

                const res = await fetch(endpoint, { headers: {'Authorization': `Bearer ${token}`} });
                produtosGlobais = await res.json();
                
                const sel = document.getElementById('produto');
                sel.innerHTML = '<option value="">Selecione o produto...</option>';
                
                produtosGlobais.forEach(p => {
                    const id = p.produto_id || p.id;
                    const nome = p.produto_nome || p.nome;
                    const estoque = (p.quantidade_atual !== undefined) ? p.quantidade_atual : p.estoque_central;
                    
                    sel.innerHTML += `<option value="${id}">${nome} - ${p.variacao} (Disp: ${estoque})</option>`;
                });

                if(usuarioLogado.perfil === 'ADMIN') {
                    const resL = await fetch(`${API}/parceiros`);
                    const lojas = await resL.json();
                    const selL = document.getElementById('venda_origem');
                    lojas.forEach(l => {
                        if(l.status === 'ATIVO') selL.innerHTML += `<option value="${l.id}">Venda pela Loja: ${l.nome_loja}</option>`;
                    });
                }
            } catch (err) { console.error("Erro ao carregar produtos:", err); }
        }

        function atualizarPreview() {
            const id = document.getElementById('produto').value;
            const imgEl = document.getElementById('fotoPreview');
            const placeholder = document.getElementById('placeholderFoto');
            
            const prod = produtosGlobais.find(p => (p.produto_id || p.id) == id);
            
            if (prod && prod.imagem_url) {
                imgEl.src = prod.imagem_url;
                imgEl.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                placeholder.style.display = 'flex';
            }
        }

        async function carregarVendas() {
            try {
                const res = await fetch(`${API}/vendas`, { headers: {'Authorization': `Bearer ${token}`} });
                const dados = await res.json();
                const tbody = document.getElementById('tabelaVendas'); 
                tbody.innerHTML = '';
                
                if (dados.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nenhuma venda registrada.</td></tr>';
                    return;
                }

                dados.forEach(v => {
                    const imgHTML = v.imagem_url 
                        ? `<img src="${v.imagem_url}" class="foto-venda">` 
                        : `<div class="foto-venda" style="background:#eee;"></div>`;
                    
                    const lojaHTML = (usuarioLogado.perfil === 'ADMIN') 
                        ? `<td class="td-loja"><span class="badge-loja">${v.nome_loja || 'Sede Central'}</span></td>` 
                        : '';

                    // Note que adicionei classes (td-prod, td-data, etc) para o PDF conseguir ler os dados!
                    tbody.innerHTML += `
                        <tr class="linha-venda">
                            <td>
                                <div style="display:flex; align-items:center; gap:10px;">
                                    ${imgHTML}
                                    <div class="td-prod"><strong>${v.produto_nome}</strong><br><small>${v.variacao}</small></div>
                                </div>
                            </td>
                            <td class="td-data" style="font-size: 11px;">${v.data_formatada}</td>
                            <td class="td-qtd">${v.quantidade} un.</td>
                            <td class="td-total" style="color:#059669; font-weight:bold;">R$ ${parseFloat(v.valor_total).toFixed(2)}</td>
                            ${lojaHTML}
                            <td>
                                <button class="btn-acao" title="Cancelar Venda" onclick="cancelarVenda(${v.id})">🗑️</button>
                            </td>
                        </tr>`;
                });
            } catch (err) { console.error(err); }
        }

        document.getElementById('formVenda').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnVender');
            btn.disabled = true;

            const payload = {
                produto_id: document.getElementById('produto').value,
                quantidade: document.getElementById('quantidade').value,
                parceiro_id: document.getElementById('venda_origem')?.value || null
            };

            try {
                const res = await fetch(`${API}/vendas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("✅ Venda realizada!");
                    document.getElementById('formVenda').reset();
                    atualizarPreview();
                    carregarVendas();
                    carregarProdutos();
                } else {
                    const erro = await res.json();
                    alert("❌ Erro: " + erro.erro);
                }
            } catch (err) { alert("Erro de conexão."); }
            finally { btn.disabled = false; }
        });

        async function cancelarVenda(id) {
            if (!confirm("⚠️ Deseja cancelar esta venda? O estoque será devolvido automaticamente ao centro ou à loja de origem.")) return;
            
            try {
                const res = await fetch(`${API}/vendas/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if(res.ok) {
                    carregarVendas();
                    carregarProdutos();
                }
            } catch (err) { alert("Erro ao cancelar."); }
        }

        // ==========================================
        // 🖨️ FUNÇÃO DO EXTRATO FINANCEIRO EM PDF
        // ==========================================
        function gerarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const dataAtual = new Date().toLocaleDateString('pt-BR');
            const horaAtual = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const isAdmin = usuarioLogado.perfil === 'ADMIN';

            // 1. Cabeçalho
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("PERSONALIZE 3D", 105, 20, { align: "center" });
            
            doc.setFontSize(14);
            doc.text("FECHAMENTO DE CAIXA / EXTRATO DE VENDAS", 105, 30, { align: "center" });

            // 2. Informações
            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.text(`Data de Emissão: ${dataAtual} às ${horaAtual}`, 14, 45);
            doc.text(`Operador / Responsável: ${usuarioLogado.nome || 'Administrador'}`, 14, 52);

            // 3. Preparando colunas da tabela
            const colunas = isAdmin 
                ? [['Produto / Variação', 'Data', 'Qtd', 'Origem da Venda', 'Valor Total']] 
                : [['Produto / Variação', 'Data', 'Qtd', 'Valor Total']];

            const linhasPdf = [];
            let somaTotal = 0;

            // Varre o HTML buscando os dados da tabela
            const trs = document.querySelectorAll('.linha-venda');
            
            if(trs.length === 0) {
                alert("Não há vendas para imprimir!");
                return;
            }

            trs.forEach(tr => {
                // Pega o texto e remove quebras de linha indesejadas
                const prod = tr.querySelector('.td-prod').innerText.replace(/\n/g, ' - ');
                const dataHora = tr.querySelector('.td-data').innerText;
                const qtd = tr.querySelector('.td-qtd').innerText;
                const totalTexto = tr.querySelector('.td-total').innerText;
                
                // Converte o "R$ 150.50" em número para podermos somar
                const valorLimpo = parseFloat(totalTexto.replace('R$', '').trim());
                somaTotal += valorLimpo;

                if (isAdmin) {
                    const loja = tr.querySelector('.td-loja').innerText;
                    linhasPdf.push([prod, dataHora, qtd, loja, `R$ ${valorLimpo.toFixed(2)}`]);
                } else {
                    linhasPdf.push([prod, dataHora, qtd, `R$ ${valorLimpo.toFixed(2)}`]);
                }
            });

            // 4. Desenha a Tabela de Vendas
            doc.autoTable({
                startY: 60,
                head: colunas,
                body: linhasPdf,
                theme: 'grid',
                headStyles: { fillColor: [16, 185, 129] }, // Verde para lembrar dinheiro/vendas
                styles: { fontSize: 10 }
            });

            // 5. Totalizador no Final do Documento
            const finalY = doc.lastAutoTable.finalY + 15; 
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            // Alinhado à direita
            doc.text(`TOTAL ARRECADADO: R$ ${somaTotal.toFixed(2)}`, 195, finalY, { align: 'right' });

            // 6. Download
            doc.save(`Extrato_Vendas_${dataAtual.replace(/\//g, '-')}.pdf`);
        }

        carregarProdutos();
        carregarVendas();
    </script>
</body>
</html>
