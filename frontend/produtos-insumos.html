<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Insumos - PERSONALIZE Hub</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/theme.js"></script>
</head>
<body>
<div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
        <header class="page-header">
            <div class="page-title">
                <h1><i class="bx bx-box"></i> Cadastro de Insumos</h1>
                <p>Cadastre materiais e insumos para usá-los na precificação detalhada dos produtos.</p>
            </div>
        </header>

        <section class="card">
            <div class="card-title"><span id="tituloInsumo">Cadastrar insumo</span><button type="button" class="btn btn-light hidden" id="btnCancelarEdicaoInsumo">Cancelar edição</button></div>
            <form id="formInsumo">
                <input type="hidden" id="insumo_id">
                <div class="form-grid">
                    <div class="form-group"><label>Nome do insumo</label><input id="nome" required placeholder="Ex: Filamento PLA, Papel adesivo..."></div>
                    <div class="form-group"><label>Unidade</label>
                        <select id="unidade">
                            <option value="un">un</option><option value="g">g</option><option value="kg">kg</option>
                            <option value="ml">ml</option><option value="L">L</option><option value="folha">folha</option>
                            <option value="m²">m²</option><option value="m">m</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Custo / unidade (R$)</label><input id="custo_unitario" type="number" step="0.0001" min="0" value="0"></div>
                    <div class="form-group"><label>Estoque atual</label><input id="estoque_atual" type="number" step="0.001" min="0" value="0"></div>
                    <div class="form-group"><label>Status</label><select id="status"><option value="ATIVO">ATIVO</option><option value="INATIVO">INATIVO</option></select></div>
                    <div class="form-group" style="grid-column:1/-1"><label>Observação</label><input id="observacao" placeholder="Notas sobre fornecedor, especificação, etc."></div>
                </div>
                <button class="btn btn-primary w-full mt-3" id="btnSalvarInsumo">Salvar insumo</button>
            </form>
        </section>

        <section class="card">
            <div class="card-title"><span>Insumos cadastrados</span></div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Insumo</th><th>Unidade</th><th>Custo/unidade</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="tabelaInsumos"><tr><td colspan="6">Carregando...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/produtos-insumos.js"></script>
</body>
</html>
