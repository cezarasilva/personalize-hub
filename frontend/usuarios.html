<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerir Usuários - PERSONALIZE Hub</title>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        /* ==========================================
           🖥️ MODO DESKTOP (PC) 
           ========================================== */
        body { display: flex; background: #f3f4f6; height: 100vh; overflow: hidden; flex-direction: row; }
        
        .sidebar { width: 250px; background: #1f2937; color: #fff; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-top { padding: 25px 20px; text-align: center; background: #111827; }
        .sidebar-top h2 { color: #60a5fa; font-weight: 800; font-size: 1.5rem; margin: 0; }
        .btn-menu { display: none; } 
        
        .sidebar-links { display: flex; flex-direction: column; flex: 1; overflow-y: auto; }
        .sidebar a { padding: 15px 20px; color: #d1d5db; text-decoration: none; border-left: 4px solid transparent; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .sidebar a:hover { background: #374151; color: #fff; }
        .sidebar a.ativo { background: #374151; border-left-color: #3b82f6; color: #fff; }
        .btn-sair { margin-top: auto; color: #f87171 !important; border-top: 1px solid #374151; }

        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        h1 { font-size: 24px; margin-bottom: 25px; color: #1f2937; }
        
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
        th { color: #6b7280; text-transform: uppercase; font-size: 12px; font-weight: 700; background: #f9fafb; }
        
        .btn-senha { background: #f59e0b; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; white-space: nowrap; }
        .btn-senha:hover { background: #d97706; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 5px; transition: 0.2s; white-space: nowrap; }
        .btn-del:hover { background: #dc2626; }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; display: inline-block; white-space: nowrap; }
        .ativo { background: #dcfce7; color: #166534; }
        .bloqueado { background: #fee2e2; color: #991b1b; }

        /* ==========================================
           📱 MODO CELULAR (Menu Hamburguer)
           ========================================== */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: visible; }
            
            .sidebar { width: 100%; height: auto; position: relative; overflow: visible; }
            .sidebar-top { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #111827; }
            .sidebar-top h2 { font-size: 1.3rem; text-align: left; }
            
            .btn-menu { 
                display: flex; background: #3b82f6; color: white; border: none; font-size: 24px; 
                width: 40px; height: 40px; border-radius: 6px; align-items: center; justify-content: center; 
                cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }
            
            .sidebar-links { 
                display: none; position: absolute; top: 100%; left: 0; width: 100%; 
                background: #1f2937; box-shadow: 0 10px 15px rgba(0,0,0,0.5); z-index: 9999; 
            }
            .sidebar-links.ativo-mobile { display: flex !important; }

            .sidebar a { padding: 15px 20px; border-bottom: 1px solid #374151; border-left: none; }
            .sidebar a.ativo { border-left: none; background: #374151; border-left: 4px solid #3b82f6; }
            
            .main { padding: 15px; overflow-y: visible; }
            .card { padding: 15px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    
    <div class="sidebar">
        <div class="sidebar-top">
            <h2>PERSONALIZE</h2>
            <button class="btn-menu" onclick="toggleMenu()">☰</button>
        </div>
        <div class="sidebar-links" id="menuLinks">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="produtos.html">📦 Produtos & Peças</a>
            <a href="parceiros.html">🏪 Lojas Parceiras</a>
            <a href="usuarios.html" class="ativo">👥 Usuários</a>
            <a href="remessas.html">🚚 Remessas (Estoque)</a>
            <a href="vendas.html">💰 Frente de Caixa</a>
            <a class="btn-sair" onclick="sair()">🚪 Sair</a>
        </div>
    </div>

    <div class="main">
        <div class="card">
            <h1>👥 Usuários do Sistema (Controle de Login)</h1>
            <div class="table-container">
                <table>
                    <thead><tr><th>Nome / E-mail</th><th>Vínculo</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="listaU">
                        <tr><td colspan="4" style="text-align: center;">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token_personalize');
        if(!token || localStorage.getItem('perfil_usuario') !== 'ADMIN') window.location.href='index.html';

        function toggleMenu() {
            const menu = document.getElementById('menuLinks');
            menu.classList.toggle('ativo-mobile');
        }

        const Toast = Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true
        });

        async function carregar() {
            try {
                const res = await fetch('/api/usuarios', { headers: {'Authorization': `Bearer ${token}`} });
                const users = await res.json();
                const tbody = document.getElementById('listaU'); 
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Nenhum usuário encontrado.</td></tr>';
                    return;
                }
                
                tbody.innerHTML = '';
                users.forEach(u => {
                    tbody.innerHTML += `<tr>
                        <td><strong>${u.nome}</strong><br><small style="color: #6b7280;">${u.email}</small></td>
                        <td>${u.nome_loja || 'ADMINISTRADOR'}</td>
                        <td><span class="badge ${u.ativo ? 'ativo' : 'bloqueado'}">${u.ativo ? 'ATIVO' : 'BLOQUEADO'}</span></td>
                        <td>
                            <button class="btn-senha" onclick="reset('${u.id}', '${u.nome}')">Nova Senha</button>
                            ${u.perfil !== 'ADMIN' ? `<button class="btn-del" onclick="deletar('${u.id}')">Excluir</button>` : ''}
                        </td>
                    </tr>`;
                });
            } catch (err) { Toast.fire({ icon: 'error', title: 'Erro ao carregar lista' }); }
        }

        async function reset(id, nome) {
            const { value: novaSenha } = await Swal.fire({
                title: 'Redefinir Senha',
                input: 'text', /* Text para ver o que está digitando */
                inputLabel: `Digite a nova senha para ${nome}:`,
                inputPlaceholder: 'Nova senha forte',
                showCancelButton: true,
                confirmButtonText: 'Salvar Senha',
                cancelButtonText: 'Cancelar',
                inputValidator: (value) => { if (!value || value.length < 4) return 'A senha deve ter pelo menos 4 caracteres!' }
            });

            if (novaSenha) {
                try {
                    const res = await fetch(`/api/usuarios/${id}`, {
                        method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                        body: JSON.stringify({ nome, senha: novaSenha, ativo: true })
                    });
                    if(res.ok) Toast.fire({ icon: 'success', title: 'Senha redefinida com sucesso!' });
                    else Swal.fire('Erro', 'Não foi possível redefinir a senha.', 'error');
                } catch (err) { Swal.fire('Erro de Conexão', 'Verifique sua internet.', 'error'); }
            }
        }

        async function deletar(id) {
            const confirmacao = await Swal.fire({
                title: 'Excluir Usuário?',
                text: "Tem certeza? O acesso deste parceiro será removido permanentemente.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, excluir!',
                cancelButtonText: 'Cancelar'
            });

            if(confirmacao.isConfirmed) {
                try {
                    const res = await fetch(`/api/usuarios/${id}`, { method: 'DELETE', headers: {'Authorization': `Bearer ${token}`} });
                    if(res.ok) { Toast.fire({ icon: 'success', title: 'Usuário removido.' }); carregar(); }
                } catch (err) { Swal.fire('Erro', 'Não foi possível excluir o usuário.', 'error'); }
            }
        }
        
        function sair() { localStorage.clear(); window.location.href='index.html'; }
        
        carregar();
    </script>
</body>
</html>
