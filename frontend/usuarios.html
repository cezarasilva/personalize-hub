<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerir Usuários - PERSONALIZE Hub</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { display: flex; background: #f3f4f6; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: #1f2937; color: #fff; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; color: #60a5fa; font-weight: 800; }
        .sidebar a { padding: 15px 20px; color: #d1d5db; text-decoration: none; border-left: 4px solid transparent; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.ativo { background: #374151; border-left-color: #3b82f6; color: #fff; }
        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        h1 { font-size: 24px; margin-bottom: 25px; color: #1f2937; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #f3f4f6; }
        th { color: #6b7280; text-transform: uppercase; font-size: 12px; font-weight: 700; }
        .btn-senha { background: #f59e0b; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 5px; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .ativo { background: #dcfce7; color: #166534; }
        .bloqueado { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>PERSONALIZE</h2>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="produtos.html">📦 Produtos & Peças</a>
        <a href="parceiros.html">🏪 Lojas Parceiras</a>
        <a href="usuarios.html" class="ativo">👥 Usuários do Sistema</a>
        <a href="remessas.html">🚚 Remessas (Estoque)</a>
        <a href="vendas.html">💰 Frente de Caixa</a>
        <a onclick="sair()" style="cursor:pointer; margin-top:auto; color: #f87171; padding: 15px 20px; font-weight: bold;">🚪 Sair do Sistema</a>
    </div>
    <div class="main">
        <div class="card">
            <h1>👥 Usuários do Sistema (Controle de Login)</h1>
            <table>
                <thead><tr><th>Nome / E-mail</th><th>Vínculo</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody id="listaU"></tbody>
            </table>
        </div>
    </div>
    <script>
        const token = localStorage.getItem('token_personalize');
        if(!token || localStorage.getItem('perfil_usuario') !== 'ADMIN') window.location.href='index.html';

        async function carregar() {
            const res = await fetch('http://localhost:3000/api/usuarios', { headers: {'Authorization': `Bearer ${token}`} });
            const users = await res.json();
            const tbody = document.getElementById('listaU'); tbody.innerHTML = '';
            users.forEach(u => {
                tbody.innerHTML += `<tr>
                    <td><strong>${u.nome}</strong><br><small>${u.email}</small></td>
                    <td>${u.nome_loja || 'ADMINISTRADOR'}</td>
                    <td><span class="badge ${u.ativo ? 'ativo' : 'bloqueado'}">${u.ativo ? 'ATIVO' : 'BLOQUEADO'}</span></td>
                    <td>
                        <button class="btn-senha" onclick="reset('${u.id}', '${u.nome}')">Nova Senha</button>
                        ${u.perfil !== 'ADMIN' ? `<button class="btn-del" onclick="deletar('${u.id}')">Excluir</button>` : ''}
                    </td>
                </tr>`;
            });
        }

        async function reset(id, nome) {
            const nova = prompt("Digite a nova senha para " + nome);
            if(nova) {
                const res = await fetch(`http://localhost:3000/api/usuarios/${id}`, {
                    method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                    body: JSON.stringify({ nome, senha: nova, ativo: true })
                });
                if(res.ok) alert("Senha redefinida!");
            }
        }

        async function deletar(id) {
            if(confirm("Remover acesso deste usuário permanentemente?")) {
                await fetch(`http://localhost:3000/api/usuarios/${id}`, { method: 'DELETE', headers: {'Authorization': `Bearer ${token}`} });
                carregar();
            }
        }
        function sair() { localStorage.clear(); window.location.href='index.html'; }
        carregar();
    </script>
</body>
</html>
