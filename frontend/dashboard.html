<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PERSONALIZE Hub</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="layout">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main">
            <header class="page-header">
                <div class="page-title"><h1>📊 Dashboard</h1><p id="subtituloDashboard">Visão geral do sistema.</p></div>
                <a href="vendas.html" class="btn btn-success">Registrar venda</a>
            </header>
            <section class="grid grid-4 mb-2">
                <div class="stat-card"><span>Vendas do mês</span><strong id="pedidosMes">0</strong></div>
                <div class="stat-card"><span>Receita/repasse do mês</span><strong id="receitaMes">R$ 0,00</strong></div>
                <div class="stat-card"><span>Qtd. em estoque</span><strong id="qtdEstoque">0</strong></div>
                <div class="stat-card"><span>Valor em estoque</span><strong id="valorEstoque">R$ 0,00</strong></div>
            </section>
            <section class="card chart-card"><div class="card-title">Vendas dos últimos 7 dias</div><canvas id="graficoVendas"></canvas></section>
            <section class="grid grid-3">
                <div class="card"><div class="card-title">🏪 Estoque por loja</div><div id="estoqueParceiros"></div></div>
                <div class="card"><div class="card-title">⚠️ Estoque baixo</div><div id="estoqueBaixo"></div></div>
                <div class="card"><div class="card-title">🏆 Mais vendidos</div><div id="rankingProdutos"></div></div>
            </section>
        </main>
    </div>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
