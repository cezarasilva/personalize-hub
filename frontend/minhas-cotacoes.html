<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Solicitações - PERSONALIZE Hub</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="/assets/js/theme.js"></script>
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="page-header">
        <div class="page-title">
          <h1><i class="bx bx-list-check"></i> Minhas Solicitações</h1>
          <p>Acompanhe pedidos de reposição, modelos novos, cotações, orçamento, prazo e aprovação.</p>
        </div>
        <a class="btn btn-success" href="solicitar-produto.html">Nova solicitação</a>
      </header>
      <section class="card">
        <div class="kanban-toolbar">
          <div class="form-group"><label>Buscar</label><input id="filtroBusca" placeholder="Código, produto, descrição..."></div>
          <div class="form-group"><label>Status</label><select id="filtroStatus"><option value="">Todos</option><option value="ABERTA">Aberta</option><option value="SEPARACAO">Separando</option><option value="DESENVOLVIMENTO">Desenvolvendo</option><option value="AGUARDANDO_APROVACAO">Aguardando aprovação</option><option value="APROVADA">Aprovada</option><option value="PRODUCAO">Produzindo</option><option value="TRANSPORTE">Transporte</option><option value="CONCLUIDA">Concluída</option><option value="RECUSADA">Recusada</option></select></div>
          <button class="btn btn-primary" id="btnAtualizar">Atualizar</button>
        </div>
        <div id="listaSolicitacoes"></div>
      </section>
    </main>
  </div>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages/minhas-cotacoes.js"></script>
</body>
</html>
