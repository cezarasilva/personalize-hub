<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja Parceiro - PERSONALIZE Hub</title>
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" href="assets/icons/favicon-32.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="P-HUB">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="/assets/js/theme.js"></script>
</head>
<body class="auth-body">
    <main class="auth-box">
        <section class="auth-brand">
            <h2>Seja um revendedor</h2>
            <p>Preencha os dados para análise da PERSONALIZE.</p>
        </section>
        <form id="formReg">
            <div class="form-group"><label for="loja">Nome da loja</label><input type="text" id="loja" name="nome_loja" required></div>
            <div class="form-group mt-2"><label for="resp">Responsável</label><input type="text" id="resp" name="responsavel" required></div>
            <div class="form-group mt-2"><label for="tel">WhatsApp</label><input type="text" id="tel" name="telefone" required></div>
            <div class="form-group mt-2"><label for="email">E-mail de login</label><input type="email" id="email" name="email_login" required></div>
            <div class="form-group mt-2"><label for="senha">Senha</label><input type="password" id="senha" name="senha_login" minlength="6" required></div>
            <button type="submit" class="btn btn-primary w-full mt-3" id="btnReg">Enviar solicitação</button>
        </form>
        <div id="mensagem" class="msg"></div>
        <footer class="auth-footer"><a href="index.html">← Voltar para o login</a></footer>
    </main>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/pages/registrar.js"></script>
</body>
</html>
