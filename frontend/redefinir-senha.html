<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - PERSONALIZE Hub</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 45px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid #e5e7eb; }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand h2 { color: #1f2937; font-size: 24px; font-weight: 800; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #374151; }
        input { width: 100%; padding: 12px; border: 1.5px solid #d1d5db; border-radius: 10px; outline: none; font-size: 15px; background: #f9fafb; transition: 0.3s; }
        input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .btn-login { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-login:hover { background: #059669; }
        .btn-login:disabled { background: #94a3b8; cursor: not-allowed; }
        #mensagem { text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; font-weight: 500; }
        .footer { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #f3f4f6; font-size: 14px; }
        .footer a { color: #3b82f6; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand"><h2>Criar Nova Senha</h2><p style="color: #6b7280; font-size: 14px; margin-top: 5px;">Digite sua nova senha de acesso.</p></div>
        
        <form id="formReset">
            <div class="input-group">
                <label>Nova Senha</label>
                <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="input-group">
                <label>Confirmar Nova Senha</label>
                <input type="password" id="confirmaSenha" placeholder="Repita a senha" required minlength="6">
            </div>
            <button type="submit" class="btn-login" id="btnSalvar">Salvar Senha</button>
        </form>
        
        <div id="mensagem"></div>
        <div class="footer"><a href="index.html">← Voltar para o Login</a></div>
    </div>

    <script>
        // Pega o código secreto (token) da URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('formReset').style.display = 'none';
            document.getElementById('mensagem').innerHTML = '❌ Link inválido ou ausente. Solicite a recuperação novamente.';
            document.getElementById('mensagem').style.color = '#ef4444';
        }

        document.getElementById('formReset').addEventListener('submit', async (e) => {
            e.preventDefault();
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;
            const msg = document.getElementById('mensagem');
            const btn = document.getElementById('btnSalvar');

            if (novaSenha !== confirmaSenha) {
                msg.textContent = '❌ As senhas não conferem!';
                msg.style.color = '#ef4444';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Salvando...';
            msg.textContent = '';

            try {
                const res = await fetch('/api/usuarios/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, novaSenha })
                });

                const dados = await res.json();

                if (res.ok) {
                    msg.innerHTML = '✅ Senha alterada com sucesso!<br>Redirecionando...';
                    msg.style.color = '#10b981';
                    setTimeout(() => window.location.href = 'index.html', 3000);
                } else {
                    msg.textContent = '❌ ' + dados.erro;
                    msg.style.color = '#ef4444';
                    btn.disabled = false;
                    btn.textContent = 'Salvar Senha';
                }
            } catch (err) {
                msg.textContent = '❌ Erro ao conectar com o servidor.';
                msg.style.color = '#ef4444';
                btn.disabled = false;
                btn.textContent = 'Salvar Senha';
            }
        });
    </script>
</body>
</html>
